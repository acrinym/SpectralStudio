name: Foundation CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  preservation-check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify preservation metadata
        run: python -c "import json,re,pathlib; p=pathlib.Path('preservation/manifest.json'); m=json.loads(p.read_text(encoding='utf-8')); assert m['schema_version']==1; assert len(m['artifacts'])>=4; assert all(a['bytes']>0 and re.fullmatch('[0-9a-f]{64}',a['sha256']) for a in m['artifacts']); assert pathlib.Path('docs/ROADMAP.md').is_file(); print('Foundation metadata valid (not hardware validation)')"
