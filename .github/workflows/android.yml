name: Android ring player
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Core stream and audio checks
        run: |
          mkdir -p build/core-check
          javac -d build/core-check app/src/main/java/org/spectralstudio/{MidiNotes,NoteSamples}.java tests/java/CoreChecks.java
          java -cp build/core-check CoreChecks
      - name: Build Android debug APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SpectralStudio-Android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
